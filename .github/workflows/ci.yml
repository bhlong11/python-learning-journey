name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres-db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: pnl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd fastapi-pnl
          pip install -r requirements.txt
      
      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/pnl_test
        run: |
          cd fastapi-pnl
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/pnl_test
          TEST_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/pnl_test
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
        run: |
          cd fastapi-pnl
          python -m pytest test_main.py